<rect x="625" y="190" width="160" height="190" rx="22" fill="#fff"/>
<rect x="815" y="190" width="130" height="190" rx="22" fill="#fff"/>
</g>
<g font-family="sans-serif" text-anchor="middle">
<g fill="#4b70c9"><circle cx="135" cy="245" r="28"/><text x="135" y="254" font-size="24" font-weight="700" fill="#fff">1</text></g>
<text x="135" y="306" font-size="21" font-weight="700" fill="#17243b">基礎確認</text><text x="135" y="340" font-size="15" fill="#66748a">文法・語順</text>

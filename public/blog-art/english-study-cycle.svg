<text x="515" y="306" font-size="21" font-weight="700" fill="#17243b">問題演習</text><text x="515" y="340" font-size="15" fill="#66748a">過去問・長文</text>
<g fill="#8a6bc1"><circle cx="705" cy="245" r="28"/><text x="705" y="254" font-size="24" font-weight="700" fill="#fff">4</text></g>
<text x="705" y="306" font-size="21" font-weight="700" fill="#17243b">原因分析</text><text x="705" y="340" font-size="15" fill="#66748a">なぜ間違えた？</text>

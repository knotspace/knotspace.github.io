<path d="M500 418 H580 M560 398 L580 418 L560 438" stroke="#91cbb9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="568" text-anchor="middle" fill="#b9c9dc" font-size="18" font-family="system-ui,sans-serif">カードを差し込む</text>
<text x="800" y="568" text-anchor="middle" fill="#b9c9dc" font-size="18" font-family="system-ui,sans-serif">情報をダウンロード</text>

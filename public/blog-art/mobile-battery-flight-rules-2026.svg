<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">飛行機に持ち込むモバイルバッテリーの新ルール</title><desc id="d">160Wh以下を2個まで。機内での充電と給電は禁止。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b3d"/><stop offset="1" stop-color="#07121d"/></linearGradient><linearGradient id="battery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d39a"/><stop offset="1" stop-color="#d59c58"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1000" cy="90" r="260" fill="#4c9db1" opacity=".12"/>
<circle cx="170" cy="600" r="260" fill="#e4b16c" opacity=".08"/>
<g fill="none" stroke="#83b8c3" stroke-width="2" opacity=".35"><path d="M0 430 Q260 330 510 430 T1200 400"/><path d="M0 470 Q260 370 510 470 T1200 440"/></g>
<text x="76" y="94" fill="#9bc6cf" font-size="22" font-family="system-ui,sans-serif" letter-spacing="5">TRAVEL / BATTERY RULES 2026</text>
<text x="76" y="184" fill="#fff8ec" font-size="62" font-weight="800" font-family="system-ui,sans-serif">機内持ち込みの</text>
<text x="76" y="258" fill="#fff8ec" font-size="62" font-weight="800" font-family="system-ui,sans-serif">新ルールを確認</text>
<g transform="translate(790 160)">
 <rect x="20" y="25" width="230" height="300" rx="28" fill="url(#battery)" stroke="#fff2d9" stroke-width="5"/>
 <rect x="88" y="4" width="94" height="24" rx="8" fill="#f4d39a"/>
 <rect x="57" y="80" width="156" height="10" rx="5" fill="#7a5630" opacity=".5"/>
 <path d="M135 118 L103 184 H142 L119 246 L180 166 H143 L163 118Z" fill="#183d4b"/>
 <text x="135" y="288" text-anchor="middle" fill="#173542" font-size="25" font-weight="800" font-family="system-ui,sans-serif">POWER</text>
</g>
<g transform="translate(76 344)">
 <rect width="285" height="122" rx="16" fill="#16394a" stroke="#5c9ba7"/>
 <text x="24" y="48" fill="#9bc6cf" font-size="18" font-family="system-ui,sans-serif">持ち込み個数</text>
 <text x="24" y="100" fill="#fff8ec" font-size="46" font-weight="800" font-family="system-ui,sans-serif">2個まで</text>
 <rect x="305" width="285" height="122" rx="16" fill="#16394a" stroke="#5c9ba7"/>
 <text x="329" y="48" fill="#9bc6cf" font-size="18" font-family="system-ui,sans-serif">容量</text>
 <text x="329" y="100" fill="#fff8ec" font-size="46" font-weight="800" font-family="system-ui,sans-serif">160Wh以下</text>
 <rect x="610" width="285" height="122" rx="16" fill="#3d2024" stroke="#c8756e"/>
 <text x="634" y="48" fill="#efb3a8" font-size="18" font-family="system-ui,sans-serif">機内での充電・給電</text>
 <text x="634" y="100" fill="#fff8ec" font-size="39" font-weight="800" font-family="system-ui,sans-serif">禁止</text>
</g>
<text x="76" y="555" fill="#b9d3d6" font-size="19" font-family="system-ui,sans-serif">2026年4月24日適用｜搭乗前に航空会社の最新案内も確認</text>

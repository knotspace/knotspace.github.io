ff"/><circle cx="700" cy="245" r="34" fill="#f0e4ff"/><text x="700" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">模</text><text x="700" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">模試</text><text x="700" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">時間配分も練習</text></g><path d="M784 294h20m-8 -8 8 8 -8 8" stroke="#7c8ba3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="810" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="890" cy="245" r="34" fill="#ffe2e2"/><text x="890" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">✓</text><text x="890" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">振り返り</text><text x="890" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">解説で定着</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">EVO SLとBOSTON 13の重量比較</title><desc id="d">27センチ片足の公表重量はEVO SLが約224グラム、BOSTON 13が約255グラム。差は約31グラム。</desc><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#f7f8f3"/><stop offset="1" stop-color="#e9eef2"/></linearGradient><linearGradient id="g"><stop stop-color="#dafa61"/><stop offset="1" stop-color="#b9e33d"/></linearGradient></defs><rect width="1000" height="560" rx="28" fill="url(#p)"/><text x="58" y="66" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#647386">AT A GLANCE / WEIGHT</text><text x="58" y="122" font-family="Arial,sans-serif" font-size="38" font-weight="900" fill="#102e52">片足の重さを比べる</text><text x="60" y="157" font-family="Arial,sans-serif" font-size="17" fill="#68788a">27cm・メーカー公表の平均重量</text><g transform="translate(60 205)"><text y="0" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#102e52">EVO SL</text><text y="54" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#102e52">224 g</text><rect y="77" width="400" height="25" rx="12" fill="#d9e0e4"/><rect y="77" width="351" height="25" rx="12" fill="url(#g)"/><text y="137" font-family="Arial,sans-serif" font-size="15" fill="#718094">軽快さを重視したい人に</text></g><g transform="translate(540 205)"><text y="0" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#102e52">BOSTON 13</text><text y="54" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#102e52">255 g</text><rect y="77" width="400" height="25" rx="12" fill="#d9e0e4"/><rect y="77" width="400" height="25" rx="12" fill="#315c84"/><text y="137" font-family="Arial,sans-serif" font-size="15" fill="#718094">ロッド搭載のトレーニングモデル</text></g><rect x="60" y="405" width="880" height="104" rx="20" fill="#102e52"/><text x="92" y="449" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#d6e1ed">WEIGHT DIFFERENCE</text><text x="92" y="489" font-family="Arial,sans-serif" font-size="35" font-weight="900" fill="#dafa61">約31 g</text><text x="345" y="472" font-family="Arial,sans-serif" font-size="19" fill="#fff">EVO SLのほうが軽い</text><text x="940" y="538" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#718094">数値はサイズ・カラー等で異なる場合があります</text></svg>
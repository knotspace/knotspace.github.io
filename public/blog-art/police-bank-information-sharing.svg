<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">警察と金融機関の情報共有の仕組み</title><desc id="desc">警察から金融機関へ不正利用口座の情報を共有し、金融機関が振込データを確認して警察へ情報を返す流れを示す図。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b20"/><stop offset="1" stop-color="#263a3a"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f2e9"/><stop offset="1" stop-color="#e9e4d8"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1040" cy="95" r="180" fill="#b7a47b" opacity=".08"/><circle cx="110" cy="570" r="230" fill="#78a99a" opacity=".08"/>
<text x="78" y="82" fill="#c7d8d0" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">KNOT / SECURITY EXPLAINER</text>
<text x="78" y="158" fill="#fffaf0" font-family="'Noto Sans JP',sans-serif" font-size="48" font-weight="700">口座情報の連携で、被害の拡大を防ぐ</text>
<text x="80" y="203" fill="#c4d1ca" font-family="'Noto Sans JP',sans-serif" font-size="21">警察と金融機関の「情報共有型連携」</text>
<rect x="82" y="270" width="330" height="215" rx="20" fill="url(#panel)"/>
<path d="M160 335h174l-87-54z" fill="#285448"/><rect x="175" y="340" width="144" height="92" rx="5" fill="#d6dfd4"/><path d="M190 350v70m42-70v70m42-70v70" stroke="#285448" stroke-width="12"/><rect x="150" y="432" width="195" height="12" rx="6" fill="#285448"/>
<text x="247" y="470" text-anchor="middle" fill="#1d342e" font-family="'Noto Sans JP',sans-serif" font-size="25" font-weight="700">警察</text>
<rect x="790" y="270" width="330" height="215" rx="20" fill="url(#panel)"/>
<path d="M880 347h150v92H880z" fill="#d6dfd4" stroke="#285448" stroke-width="5"/><path d="M870 347l85-55 85 55" fill="none" stroke="#285448" stroke-width="8"/><path d="M915 370h80m-80 22h80m-80 22h50" stroke="#285448" stroke-width="8" stroke-linecap="round"/>
<text x="955" y="470" text-anchor="middle" fill="#1d342e" font-family="'Noto Sans JP',sans-serif" font-size="25" font-weight="700">金融機関</text>
<path d="M430 340h315" stroke="#d5b57b" stroke-width="7" stroke-linecap="round"/><path d="M724 321l24 19-24 19" fill="none" stroke="#d5b57b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M748 420H433" stroke="#82b7a3" stroke-width="7" stroke-linecap="round"/><path d="M454 401l-24 19 24 19" fill="none" stroke="#82b7a3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="585" y="310" text-anchor="middle" fill="#e6d0a8" font-family="'Noto Sans JP',sans-serif" font-size="19">不正利用口座の情報</text>
<text x="585" y="465" text-anchor="middle" fill="#a9d0bf" font-family="'Noto Sans JP',sans-serif" font-size="19">振込データの照合結果</text>
<rect x="82" y="526" width="1038" height="54" rx="12" fill="#ffffff" opacity=".08"/>
<text x="110" y="561" fill="#f1eadb" font-family="'Noto Sans JP',sans-serif" font-size="20">47都道府県警察の情報を集約</text><text x="1090" y="561" text-anchor="end" fill="#e4c58f" font-family="'Noto Sans JP',sans-serif" font-size="20" font-weight="700">協定先 30金融機関</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">英検準2級 学習ロードマップ</title><desc id="desc">5つの学習ポイントをバランスよく進めよう</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#edf7f4"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24324a" flood-opacity=".10"/></filter></defs>
<rect width="1000" height="560" rx="28" fill="url(#bg)"/>
<text x="54" y="78" font-family="sans-serif" font-size="34" font-weight="700" fill="#17243a">英検準2級 学習ロードマップ</text>
<text x="56" y="116" font-family="sans-serif" font-size="17" fill="#53627a">5つの学習ポイントをバランスよく進めよう</text>
<g filter="url(#shadow)"><rect x="50" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="130" cy="245" r="34" fill="#dce8ff"/><text x="130" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">01</text><text x="130" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">単語</text><text x="130" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">毎日くり返す</text></g><path d="M214 294h20m-8 -8 8 8 -8 8" stroke="#7c8ba3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="240" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="320" cy="245" r="34" fill="#d9f2e8"/><text x="320" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">02</text><text x="320" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">読解</text><text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">根拠を探す</text></g><path d="M404 294h20m-8 -8 8 8 -8 8" stroke="#7c8ba3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="430" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="510" cy="245" r="34" fill="#fff0d7"/><text x="510" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">03</text><text x="510" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">リスニング</text><text x="510" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">聞き直して確認</text></g><path d="M594 294h20m-8 -8 8 8 -8 8" stroke="#7c8ba3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="620" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="700" cy="245" r="34" fill="#f0e4ff"/><text x="700" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">04</text><text x="700" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">英作文</text><text x="700" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">型を身につける</text></g><path d="M784 294h20m-8 -8 8 8 -8 8" stroke="#7c8ba3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="810" y="184" width="160" height="220" rx="20" fill="#fff"/><circle cx="890" cy="245" r="34" fill="#ffe2e2"/><text x="890" y="257" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24324a">05</text><text x="890" y="318" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24324a">直前確認</text><text x="890" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">新教材を増やさない</text></g>
<rect x="50" y="450" width="900" height="62" rx="16" fill="#17243a"/><text x="500" y="489" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#fff">解きっぱなしにせず、間違いを次の練習につなげる</text></svg>
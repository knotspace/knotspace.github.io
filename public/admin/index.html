<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="application-name" content="KNOT CMS Studio" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KNOT CMS" />
    <title>KNOT CMS Studio</title>
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="icon" href="/admin/admin-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/admin/admin-app-icon.svg" />
    <!-- Warm up the Turbo control plane and login origin before the CMS initializes. -->
    <link rel="dns-prefetch" href="//sb.decapcms.org" />
    <link rel="dns-prefetch" href="//turbo.decapcms.org" />
    <link rel="preconnect" href="https://sb.decapcms.org" crossorigin />
    <link rel="preconnect" href="https://turbo.decapcms.org" crossorigin />
    <link rel="preload" href="/admin/decap-cms.js" as="script" fetchpriority="high" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <button id="knot-theme-toggle" type="button" aria-label="ライトモードに切り替え" title="ライトモードに切り替え">☾ ダーク</button>
    <script>
      (() => {
        const key = "knot-admin-theme";
        const root = document.documentElement;
        let theme = "dark";
        try { theme = localStorage.getItem(key) || "dark"; } catch {}
        const button = document.getElementById("knot-theme-toggle");
        const apply = () => {
          root.dataset.theme = theme;
          const dark = theme === "dark";
          button.textContent = dark ? "☀ ライト" : "☾ ダーク";
          button.setAttribute("aria-label", dark ? "ライトモードに切り替え" : "ダークモードに切り替え");
          button.title = dark ? "ライトモードに切り替え" : "ダークモードに切り替え";
        };
        button.addEventListener("click", () => {
          theme = theme === "dark" ? "light" : "dark";
          try { localStorage.setItem(key, theme); } catch {}
          apply();
        });
        apply();
      })();
    </script>
    <script defer src="/admin/editor-tools.js"></script>
    <script defer src="/admin/decap-cms.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const registration = await navigator.serviceWorker.register("/admin/sw.js", {
              scope: "/admin/",
              updateViaCache: "none"
            });
            await registration.update();
          } catch (error) {
            console.warn("KNOT CMS Studio offline shell unavailable:", error);
          }
        });
      }
    </script>
  </body>
</html>

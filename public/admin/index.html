<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#252c30" />
    <title>KNOT Admin</title>
    <link rel="icon" href="/admin/knot-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <button id="knot-theme-toggle" type="button" aria-label="ライトモードに切り替え" title="ライトモードに切り替え">☾ ダーク</button>
    <script>
      (() => {
        const key = "knot-admin-theme";
        const root = document.documentElement;
        let theme = "dark";
        try { theme = localStorage.getItem(key) || "dark"; } catch {}
        const button = document.getElementById("knot-theme-toggle");
        const apply = () => {
          root.dataset.theme = theme;
          const dark = theme === "dark";
          button.textContent = dark ? "☀ ライト" : "☾ ダーク";
          button.setAttribute("aria-label", dark ? "ライトモードに切り替え" : "ダークモードに切り替え");
          button.title = dark ? "ライトモードに切り替え" : "ダークモードに切り替え";
        };
        button.addEventListener("click", () => {
          theme = theme === "dark" ? "light" : "dark";
          try { localStorage.setItem(key, theme); } catch {}
          apply();
        });
        apply();
      })();
    </script>
    <!-- Writing helpers are loaded before Decap so they can enhance the editor as it renders. -->
    <script defer src="/admin/editor-tools.js"></script>
    <script defer src="/admin/decap-cms.js"></script>
  </body>
</html>

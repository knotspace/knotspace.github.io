<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d2327" />
    <title>KNOT Admin | 管理画面</title>
    <link rel="icon" href="/admin/knot-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="knot-admin-bar">
      <a class="knot-admin-brand" href="/" aria-label="KNOTトップページ"><img src="/admin/knot-logo.svg" alt="" width="22" height="22" /> KNOT</a>
      <span class="knot-admin-divider">/</span>
      <span>管理画面</span>
      <a class="knot-admin-view-site" href="/">サイトを表示 <span aria-hidden="true">↗</span></a>
    </div>

    <div id="cms-loading" role="status" aria-live="polite">
      <div class="knot-loading-mark">K</div>
      <h1>KNOT Admin</h1>
      <p>管理画面を読み込んでいます。</p>
      <a href="/">サイトトップへ戻る</a>
    </div>

    <!-- turbo-github is bundled starting with Decap CMS 3.17.0. -->
    <script defer src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0/dist/decap-cms.js"></script>
  </body>
</html>

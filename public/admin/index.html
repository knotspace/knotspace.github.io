<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1d2327" />
    <title>KNOT Admin</title>
    <link rel="icon" href="/admin/knot-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <button id="knot-theme-toggle" type="button" aria-label="ダークモードに切り替え" title="ダークモードに切り替え">
      <span aria-hidden="true">☾</span><span class="knot-theme-label">ダーク</span>
    </button>
    <script>
      (() => {
        const key = "knot-admin-theme";
        const root = document.documentElement;
        let theme = "light";
        try { theme = localStorage.getItem(key) || "light"; } catch {}
        const apply = () => {
          root.dataset.theme = theme;
          const button = document.getElementById("knot-theme-toggle");
          if (!button) return;
          const dark = theme === "dark";
          button.innerHTML = dark
            ? '<span aria-hidden="true">☀</span><span class="knot-theme-label">ライト</span>'
            : '<span aria-hidden="true">☾</span><span class="knot-theme-label">ダーク</span>';
          button.setAttribute("aria-label", dark ? "ライトモードに切り替え" : "ダークモードに切り替え");
          button.title = dark ? "ライトモードに切り替え" : "ダークモードに切り替え";
        };
        document.getElementById("knot-theme-toggle").addEventListener("click", () => {
          theme = theme === "dark" ? "light" : "dark";
          try { localStorage.setItem(key, theme); } catch {}
          apply();
        });
        apply();
      })();
    </script>
    <!-- Decap CMS renders directly from the top of the page. -->
    <script defer src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.0/dist/decap-cms.js"></script>
  </body>
</html>

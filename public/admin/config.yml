# KNOT CMS — Decap CMS
# 日本語UI・WordPress風の管理画面設定
backend:
  name: turbo-github
  turbo_site_id: c0c81edd-df75-489a-a3c5-bc97d37c40e0
  branch: main

locale: ja
logo:
  src: /admin/knot-logo.svg
  show_in_header: true

site_url: https://knotspace.github.io
display_url: https://knotspace.github.io
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: ブログ記事
    label_singular: 記事
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: blog/{{slug}}/
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: [pubDate, title]
    fields:
      - label: タイトル
        name: title
        widget: string
        required: true
        hint: "検索結果や記事一覧に表示されるタイトル。内容がひと目で伝わる長さがおすすめ。"
      - label: 記事の説明
        name: description
        widget: text
        required: true
        hint: "検索結果に表示される紹介文。記事の要点を2〜3文でまとめよう。"
      - label: 公開日
        name: pubDate
        widget: datetime
        hint: "記事を公開する日付。"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        required: true
      - label: 予約公開日時
        name: publishAt
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        hint: "指定した日時まではサイトに表示されず、時刻になると自動公開されるよ。空欄なら通常公開。"
      - label: 更新日
        name: updatedDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: カテゴリー
        name: category
        widget: select
        options:
          - お知らせ
          - 英検・勉強法
          - 本・読書
          - 高校受験
          - 勉強法
          - ガジェット
          - アプリ・ソフト
          - 日記
          - その他
        default: その他
        required: true
        hint: "一覧から選ぶだけ。カテゴリーを統一して記事を整理しやすくするよ。"
      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
        hint: "記事の内容を表すキーワード。1記事あたり2〜5個が目安。"
      - label: アイキャッチ画像
        name: heroImage
        widget: image
        required: false
        hint: "記事一覧や記事上部に表示する画像。なくても公開できるよ。"
      - label: 本文
        name: body
        widget: markdown
        required: true
        hint: "見出し・太字・リンク・箇条書き・引用・コードをツールバーから挿入できるよ。新規記事には下書きテンプレートが入る。"
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        default: |
          ## はじめに

          この記事で紹介する内容を簡単にまとめます。

          ## 本題

          ### ポイント1

          ここに内容を書きます。

          ### ポイント2

          ここに内容を書きます。

          ## まとめ

          重要なポイントを振り返ります。

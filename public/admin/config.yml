# KNOT CMS — Decap CMS
# 日本語UI・WordPress風の管理画面設定
backend:
  name: turbo-github
  turbo_site_id: c0c81edd-df75-489a-a3c5-bc97d37c40e0
  branch: main

locale: ja
logo:
  src: /admin/knot-logo.svg
  show_in_header: true

site_url: https://knotspace.github.io
display_url: https://knotspace.github.io
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: blog
    label: ブログ記事
    label_singular: 記事
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: blog/{{slug}}/
    summary: "{{title}} — {{pubDate}}"
    sortable_fields: [pubDate, title]
    fields:
      - label: タイトル
        name: title
        widget: string
        required: true
        hint: "検索結果や記事一覧に表示されるタイトル。本名・学校名・学年・住所など、個人が分かる情報は入れないでね。"
      - label: 記事の説明
        name: description
        widget: text
        required: true
        hint: "検索結果に表示される紹介文。記事の要点を2〜3文でまとめよう。"
      - label: 公開日
        name: pubDate
        widget: datetime
        hint: "記事を公開する日付。"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        required: true
      - label: 予約公開日時
        name: publishAt
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        hint: "指定した日時まではサイトに表示されず、時刻になると自動公開されるよ。空欄なら通常公開。"
      - label: 更新日
        name: updatedDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
      - label: カテゴリー
        name: category
        widget: select
        options:
          - お知らせ
          - 英検・勉強法
          - 本・読書
          - 高校受験
          - 勉強法
          - ガジェット
          - アプリ・ソフト
          - 日記
          - その他
        default: その他
        required: true
        hint: "一覧から選ぶだけ。カテゴリーを統一して記事を整理しやすくするよ。"
      - label: タグ
        name: tags
        widget: list
        required: false
        default: []
        hint: "記事の内容を表すキーワード。1記事あたり2〜5個が目安。"
      - label: アイキャッチ画像
        name: heroImage
        widget: image
        required: false
        hint: "記事一覧や記事上部に表示する画像。顔写真・制服・住所や学校が分かる背景・位置情報付き写真は使わないでね。"
      - label: 本文ブロック（WordPress風）
        name: blocks
        widget: list
        required: false
        collapsed: false
        summary: "{{type}}｜{{fields.text}}"
        types:
          - label: 段落
            name: paragraph
            widget: object
            fields:
              - { label: 文章, name: text, widget: text }
          - label: 見出し
            name: heading
            widget: object
            fields:
              - { label: 見出し文字, name: text, widget: string }
              - { label: 見出しレベル, name: level, widget: select, options: [{label: H2, value: 2}, {label: H3, value: 3}], default: 2 }
          - label: 画像
            name: image
            widget: object
            fields:
              - { label: 画像, name: src, widget: image }
              - { label: 代替テキスト, name: alt, widget: string, required: false }
              - { label: キャプション, name: caption, widget: string, required: false }
          - label: 引用
            name: quote
            widget: object
            fields:
              - { label: 引用文, name: text, widget: text }
              - { label: 出典・人物名, name: attribution, widget: string, required: false }
          - label: ポイント・補足枠
            name: callout
            widget: object
            fields:
              - { label: 見出し, name: title, widget: string }
              - { label: 内容, name: text, widget: text }
              - { label: デザイン, name: style, widget: select, options: [point, note, warning, summary], default: note }
          - label: リスト
            name: list
            widget: object
            fields:
              - { label: 項目（1行に1つ）, name: items, widget: text }
              - { label: 番号付きリスト, name: ordered, widget: boolean, default: false }
          - label: ボタン
            name: button
            widget: object
            fields:
              - { label: 表示文字, name: label, widget: string }
              - { label: リンク先, name: url, widget: string }
          - label: 区切り線
            name: divider
            widget: object
            fields:
              - { label: 区切り線, name: enabled, widget: boolean, default: true }
      - label: 旧形式の本文（Markdown）
        name: body
        widget: markdown
        required: false
        hint: "上の本文ブロックで段落・見出し・画像・引用・囲み枠・リストなどを追加して並べ替えできます。旧記事の編集では下のMarkdown本文も使えます。個人情報は掲載しないでね。"
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        default: |
          ## はじめに

          この記事で紹介する内容を簡単にまとめます。

          ## 本題

          ### ポイント1

          ここに内容を書きます。

          ### ポイント2

          ここに内容を書きます。

          ## まとめ

          重要なポイントを振り返ります。

  - name: site_management
    label: サイト設定
    files:
      - name: homepage
        label: トップページの紹介文
        file: src/data/site-settings.json
        format: json
        fields:
          - label: トップの小見出し
            name: introKicker
            widget: string
            required: true
          - label: 紹介文 1行目
            name: introLine1
            widget: string
            required: true
          - label: 紹介文 2行目
            name: introLine2
            widget: string
            required: true
          - label: サイト説明・検索結果向け
            name: siteDescription
            widget: text
            required: true
          - label: ナビゲーションメニュー
            name: navigation
            widget: list
            collapsed: true
            summary: "{{fields.label}} → {{fields.url}}"
            fields:
              - { label: 表示名, name: label, widget: string }
              - { label: リンク先URL, name: url, widget: string, hint: "例：/blog/ または https://example.com" }
          - label: フッター説明文
            name: footerText
            widget: text
            required: true
          - label: フッター下部の短い表記
            name: footerNote
            widget: string
            required: true
  - name: custom_pages
    label: 固定ページ（自由に作成）
    label_singular: 固定ページ
    folder: src/content/pages
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "p/{{slug}}/"
    summary: "{{title}}"
    sortable_fields: [title, pubDate]
    fields:
      - { label: ページタイトル, name: title, widget: string, required: true }
      - { label: 検索結果向け説明文, name: description, widget: text, required: true }
      - { label: 公開日, name: pubDate, widget: datetime, required: false }
      - { label: 更新日, name: updatedDate, widget: datetime, required: false }
      - { label: アイキャッチ画像, name: heroImage, widget: image, required: false }
      - { label: 検索エンジンに表示しない, name: noindex, widget: boolean, default: false, required: false }
      - label: 本文
        name: body
        widget: markdown
        required: true
        buttons: [bold, italic, strikethrough, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        hint: "見出し・文章・画像・リンク・表などを組み合わせてページを作成できます。個人情報は掲載しないでね。"
  - name: page_management
    label: 固定ページ管理
    files:
      - name: about
        label: プロフィールページ
        file: src/data/about-settings.json
        format: json
        fields:
          - { label: 上部ラベル, name: eyebrow, widget: string }
          - { label: 見出し 1行目, name: headingLine1, widget: string }
          - { label: 見出し 2行目, name: headingLine2, widget: string }
          - label: 紹介文
            name: lead
            widget: text
            hint: "個人を特定できる学校名・住所・本名・連絡先などは書かないでね。"
          - { label: ストーリーのラベル, name: storyEyebrow, widget: string }
          - { label: ストーリー見出し, name: storyTitle, widget: string }
          - label: 本文の段落
            name: storyParagraphs
            widget: list
            field: { label: 段落, name: paragraph, widget: text }
          - { label: 興味・関心, name: interests, widget: string }
          - { label: 技術・ツール, name: tech, widget: string }
  - name: study_content
    label: KNOT Study管理
    files:
      - name: foundation
        label: 基礎網羅問題（428問）
        file: src/data/study/study-foundation.json
        format: json
        fields:
          - label: 問題一覧
            name: questions
            widget: list
            collapsed: true
            summary: "{{fields.topic}}｜{{fields.term}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: 教科, name: subject, widget: select, options: [{label: 理科, value: science}, {label: 社会, value: social}] }
              - { label: 分野, name: topic, widget: string }
              - { label: 用語, name: term, widget: string }
              - { label: 問題文, name: prompt, widget: text }
              - label: 選択肢
                name: options
                widget: list
                field: { label: 選択肢, name: option, widget: string }
              - { label: 正解番号（0から）, name: correct, widget: number, value_type: int, min: 0 }
              - { label: 解説, name: explanation, widget: markdown }
              - { label: 関連ページURL, name: link, widget: string, required: false }
      - name: kosen
        label: 高専入試対策問題（183問）
        file: src/data/study/kosen-questions.json
        format: json
        fields:
          - label: 問題一覧
            name: questions
            widget: list
            collapsed: true
            summary: "{{fields.topic}}｜{{fields.q}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: 教科, name: subject, widget: select, options: [理科, 社会] }
              - { label: 分野・テーマ, name: topic, widget: string }
              - { label: 難易度, name: level, widget: select, options: [基礎, 標準, 発展] }
              - { label: 問題文, name: q, widget: text }
              - label: 選択肢
                name: choices
                widget: list
                field: { label: 選択肢, name: choice, widget: string }
              - { label: 正解番号（0から）, name: answer, widget: number, value_type: int, min: 0 }
              - { label: 解説, name: explanation, widget: markdown }
              - { label: 関連ページURL, name: link, widget: string, required: false }
      - name: quotes
        label: Study名言集（100件）
        file: src/data/study/study-quotes.json
        format: json
        fields:
          - label: 名言一覧
            name: quotes
            widget: list
            collapsed: true
            summary: "{{fields.name}}｜{{fields.text}}"
            fields:
              - { label: 名前, name: name, widget: string }
              - { label: 肩書き, name: era, widget: string }
              - { label: 言葉, name: text, widget: text }
              - { label: 補足・出典メモ, name: note, widget: text }

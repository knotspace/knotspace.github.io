<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KNOT AI Writer</title>
<style>
:root{color-scheme:light;--bg:#eef1f3;--panel:#fff;--text:#263238;--muted:#66747c;--line:#d6dde1;--accent:#3979ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:#273238;color:#fff;padding:18px max(22px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
header a{color:#c6e1f5;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
h1{font-size:25px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #25313a0b}
label{display:block;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;color:#263238;font:inherit}
textarea{min-height:180px;resize:vertical}button{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:11px 18px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#e8eef2;color:#263238}.status{color:var(--muted);min-height:26px;margin-top:12px}.output{white-space:pre-wrap;overflow-wrap:anywhere;min-height:180px;background:#f7f9fa;border:1px solid var(--line);border-radius:8px;padding:15px}
.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.panel{padding:16px}.wrap{margin:18px auto}header{padding:14px 18px}}
</style>
</head>
<body>
<header><strong>KNOT / AI WRITER</strong><a href="/admin/">管理画面へ戻る ←</a></header>
<main class="wrap">
<h1>AIライター</h1><p class="sub">Geminiで記事の下書き・校正・タイトル案を作成します。生成内容は自動公開されません。</p>
<section class="panel">
<label for="endpoint">Cloudflare Worker URL</label><input id="endpoint" type="url" placeholder="https://knot-gemini-api.ユーザー名.workers.dev">
<label for="token">管理用トークン</label><input id="token" type="password" autocomplete="off" placeholder="Cloudflareに登録したKNOT_ADMIN_TOKEN">
<label for="mode">作業内容</label><select id="mode"><option value="記事本文を作成">記事本文を作成</option><option value="タイトルと記事説明を提案">タイトル・記事説明を提案</option><option value="文章を校正・改善">文章を校正・改善</option><option value="SEOを改善">SEOを改善</option><option value="構成案を作成">記事の構成案を作成</option></select>
<label for="topic">記事テーマ・条件</label><textarea id="topic" placeholder="例：中学生向けに、無料で使えるWindowsソフトを10個紹介。初心者にもわかる説明で。"></textarea>
<div class="actions"><button id="generate">Geminiで生成する</button><button class="secondary" id="copy" type="button">結果をコピー</button></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</section>
<section class="panel"><label>生成結果</label><div class="output" id="output">ここに生成結果が表示されます。</div><p class="small">※無料枠の上限に達した場合は、Google側の制限が解除されるまで待つ必要があります。</p></section>
</main>
<script>
const $=id=>document.getElementById(id);
$("generate").addEventListener("click",async()=>{
 const endpoint=$("endpoint").value.trim().replace(/\/$/,"");
 const token=$("token").value.trim();
 const topic=$("topic").value.trim();
 if(!endpoint||!token||!topic){$("status").textContent="Worker URL・管理用トークン・テーマを入力してください。";return;}
 $("generate").disabled=true;$("status").textContent="Geminiが文章を作成中…";$("output").textContent="";
 try{
  const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json","X-KNOT-ADMIN-TOKEN":token},body:JSON.stringify({prompt:"作業："+$("mode").value+"\n\n依頼内容："+topic})});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||"リクエストに失敗しました。");
  $("output").textContent=data.text;$("status").textContent="生成完了（"+data.model+"）。内容を確認してから記事に使ってください。";
 }catch(e){$("status").textContent="エラー："+e.message;$("output").textContent="";}
 finally{$("generate").disabled=false;}
});
$("copy").addEventListener("click",async()=>{const text=$("output").textContent;if(!text||text==="ここに生成結果が表示されます。")return;try{await navigator.clipboard.writeText(text);$("status").textContent="生成結果をコピーしました。";}catch{$("status").textContent="コピーできませんでした。";}});
</script>
</body></html>

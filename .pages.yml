
media:
  - name: blog-images
    label: 記事画像
    input: public/images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    rename: safe

content:
  - name: blog
    label: ブログ記事
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    fields:
      - name: title
        label: 記事タイトル
        type: string
        required: true

      - name: description
        label: 記事の説明
        type: text
        required: true

      - name: pubDate
        label: 投稿日
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updatedDate
        label: 更新日
        type: date
        options:
          format: yyyy-MM-dd

      - name: category
        label: カテゴリー
        type: string
        required: true

      - name: heroImage
        label: アイキャッチ画像
        type: image
        options:
          media: blog-images

      - name: body
        label: 記事本文
        type: rich-text

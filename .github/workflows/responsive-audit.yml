name: KNOT Responsive Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knot-responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Build and inspect all published pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install site dependencies
        run: npm install --no-audit --no-fund
      - name: Build all site pages
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check every generated route at mobile, tablet and desktop widths
        run: npm run test:responsive
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: knot-responsive-audit-screenshots
          path: artifacts/responsive/
          if-no-files-found: ignore
          retention-days: 7

name: Build Astro site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync Study question bank from dedicated repository
        run: npm run study:sync
      - name: Validate Study question banks
        run: npm run study:validate
      - name: Independently verify KOSEN math answers
        run: python scripts/study/verify-math-beta.py
      - name: Build Astro site
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Install Playwright for responsive checks
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check all built pages at mobile, tablet and desktop sizes
        run: npm run test:responsive
      - name: Upload responsive audit screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knot-responsive-audit-screenshots
          path: artifacts/responsive/
          if-no-files-found: ignore
          retention-days: 7

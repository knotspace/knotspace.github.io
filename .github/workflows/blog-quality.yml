name: KNOT Blog Quality Patrol

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: knot-blog-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Remove deterministic duplicate article images
        if: github.event_name != 'pull_request'
        run: node scripts/blog-quality.mjs --fix
      - name: Commit safe automatic corrections
        id: autofix
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/content/blog
            git commit -m 'chore: automatically remove duplicate blog images'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check blog images and personal information
        run: node scripts/blog-quality.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Trigger deployment after automatic correction
        if: steps.autofix.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
      - name: Close resolved quality incident
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = '[Blog Quality] 自動検査で問題を検出';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            for (const issue of issues.filter(item => item.title === title)) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Report detected issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = '[Blog Quality] 自動検査で問題を検出';
            const body = ['KNOT Blog Quality Patrol detected a blog, privacy, or build problem.', '', '安全に自動修正できない問題は誤修正防止のため変更せず、このIssueで通知します。', '', 'Workflow: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId].join('\\n');
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const issue = issues.find(item => item.title === title);
            if (issue) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });

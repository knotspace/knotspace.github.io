name: Import National School Database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/import-mext-schools.mjs'
      - '.github/workflows/import-school-database.yml'
permissions:
  contents: write
concurrency:
  group: national-school-database
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Import MEXT school data
        run: npm run import:schools
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f public/data/game/schools.json
          git add -A src/data/game/schools.json public/data/game
          if git diff --cached --quiet; then
            echo "School database is already up to date."
          else
            git commit -m "Update national school database from MEXT"
            git pull --rebase origin main
            git push origin main
          fi

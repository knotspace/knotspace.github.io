name: Semgrep Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan source code for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Run Semgrep security rules
        run: semgrep scan --config auto --error

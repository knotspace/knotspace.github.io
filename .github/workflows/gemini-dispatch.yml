name: Gemini Dispatch

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  route:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.sender.type == 'User' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.route.outputs.command }}
      request: ${{ steps.route.outputs.request }}
      context: ${{ steps.route.outputs.context }}
    steps:
      - name: Determine Gemini task
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "command=review" >> "$GITHUB_OUTPUT"
            echo "request=automatic PR review" >> "$GITHUB_OUTPUT"
            echo "context=" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMENT_BODY" == "@gemini-cli /approve"* ]]; then
            echo "command=execute" >> "$GITHUB_OUTPUT"
            echo "request=approved plan execution" >> "$GITHUB_OUTPUT"
            echo "context=${COMMENT_BODY#@gemini-cli /approve}" >> "$GITHUB_OUTPUT"
          else
            echo "command=plan" >> "$GITHUB_OUTPUT"
            echo "request=prepare a plan only" >> "$GITHUB_OUTPUT"
            echo "context=${COMMENT_BODY#@gemini-cli}" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: route
    if: needs.route.outputs.command == 'review'
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit

  plan:
    needs: route
    if: needs.route.outputs.command == 'plan'
    uses: ./.github/workflows/gemini-invoke.yml
    with:
      additional_context: ${{ needs.route.outputs.context }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit

  execute:
    needs: route
    if: needs.route.outputs.command == 'execute'
    uses: ./.github/workflows/gemini-plan-execute.yml
    with:
      additional_context: ${{ needs.route.outputs.context }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets: inherit

name: Gemini Dispatch

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  route:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.sender.type == 'User' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '@gemini-cli'))
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.route.outputs.command }}
    steps:
      - name: Determine Gemini task
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "command=review" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMENT_BODY" == "@gemini-cli /approve"* ]]; then
            echo "command=execute" >> "$GITHUB_OUTPUT"
          elif [[ "$COMMENT_BODY" == "@gemini-cli /review"* ]]; then
            echo "command=review" >> "$GITHUB_OUTPUT"
          else
            echo "command=plan" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: route
    if: needs.route.outputs.command == 'review'
    uses: ./.github/workflows/gemini-review.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets:\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  plan:
    needs: route
    if: needs.route.outputs.command == 'plan'
    uses: ./.github/workflows/gemini-invoke.yml
    with:
      additional_context: ${{ github.event.comment.body }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets:\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  execute:
    needs: route
    if: needs.route.outputs.command == 'execute'
    uses: ./.github/workflows/gemini-plan-execute.yml
    with:
      additional_context: ${{ github.event.comment.body }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:\n      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
